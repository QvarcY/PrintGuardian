rojekts izmanto citu printera profilu. Tas var ietekmēt darba laukumu, ātrumus, paātrinājumus un starta/beigu G-code.','Nozzle diameter':'Atšķirīgs nozzle diametrs ietekmē derīgu Layer height, line width, plūsmu un detaļu smalkumu.','Build plate':'Atšķirīga Build plate izvēle var mainīt pirmā slāņa temperatūru, saķeri un starta procedūru.','Process profile':'Process profile nosaukums atšķiras. Svarīgākās konkrētās vērtības tiek salīdzinātas atsevišķi zemāk.','Layer height':'Layer height ietekmē detaļu smalkumu, virsmas kvalitāti un drukas laiku.','Wall loops':'Wall loops ietekmē sienu biezumu, izturību, materiāla patēriņu un drukas laiku.','Sparse infill density':'Sparse infill density maina iekšējā pildījuma daudzumu, stingrību, svaru un drukas laiku.','Enable support':'Enable support nosaka, vai sliceris ģenerēs balstus pārkarēm un sarežģītām vietām.','Brim width':'Brim width palīdz pirmajam slānim turēties pie plates, īpaši šaurām, augstām vai deformācijai pakļautām detaļām.','Max volumetric speed':'Max volumetric speed ierobežo, cik daudz filamenta hotend drīkst izspiest sekundē. Pārāk liela vērtība var radīt under-extrusion.'}}

$('healthTitle').textContent=title;$('warnings').textContent=text;$('safe').textContent=baseline?(lang==='lv'?'PĀRBAUDĪT UN SAGATAVOT':'REVIEW & PREPARE'):(lang==='lv'?'IESTATĪT MANU PROFILU':'SET UP MY PROFILE');$('guidedChecklist').innerHTML=guideCheck('✓',lang==='lv'?'3MF struktūra ir nolasāma':'3MF structure is readable',`${d.entries} ${lang==='lv'?'arhīva ieraksti':'archive entries'}`)+guideCheck(d.objects?'✓':'!',lang==='lv'?'Atrasta drukājama ģeometrija':'Printable geometry found',`${d.objects} ${lang==='lv'?'objekti':'objects'}`,d.objects?'ok':'bad')+guideCheck(d.printer?'✓':'!',lang==='lv'?'Printera profils ir norādīts':'Printer profile is present',d.printer||t.unknown,d.printer?'ok':'bad')+guideCheck(baseline?'✓':'?',lang==='lv'?'Salīdzināts ar manu drukas profilu':'Compared with my print profile',baseline?`${changed} ${lang==='lv'?'atšķirības atrastas':'differences found'}`:(lang==='lv'?'Iestati vienu reizi zemāk':'Set it up once below'),baseline?'ok':'pending')+guideCheck('?',lang==='lv'?'Geometry / G-code drošības audits':'Geometry / G-code safety audit',lang==='lv'?'Vēl nav pieejams šajā versijā':'Not available in this version yet','pending');renderGuided();$('summary').innerHTML=card(t.printer,(d.printer||t.unknown)+(d.nozzle?' · '+d.nozzle+' mm':''),false)+card(t.plate,d.plate||t.unknown,false)+card(t.filaments,d.filaments.length?d.filaments[0].type+(d.filaments.length>1?' +'+(d.filaments.length-1):''):t.unknown,d.filaments.length>8)+card(t.geometry,t.objects(d.objects),d.objects===0);$('settingsEyebrow').textContent=t.settingsEye;$('settingsTitle').textContent=t.settingsTitle;$('settingsHint').textContent=t.settingsHint;$('settingsCount').textContent=t.values(d.settings.length);$('settingRows').innerHTML=d.settings.map(s=>settingRow(s,t)).join('')||`<div class="row">${t.unknown}</div>`;$('factsTitle').textContent=t.factsTitle;$('facts').innerHTML=fact(t.process,d.process||t.unknown)+fact(t.fileSize,fmtBytes(d.size))+fact(t.archive,t.entries(d.entrie function card(l,v,w){return `<div class="card panel"><span class="label">${esc(l)}</span><strong title="${esc(v)}">${esc(v)}</strong><span class="pill ${w?'warn':''}">${w?L[lang].check:L[lang].read}</span></div>`}function fact(l,v){return `<div class="fact"><span>${esc(l)}</span><b title="${esc(v)}">${esc(v)}</b></div>`}function settingRow(s,t){const tip=t.tips[s.label];return `<div class="row"><div class="name">${esc(s.label)}${tip?` <span class="info">i<span class="tooltip"><b>${esc(s.label)}</b><p>${esc(tip[0])}</p><div>↑ ${esc(tip[1])}</div><div style="margin-top:6px">↓ ${esc(tip[2])}</div></span></span>`:''}</div><strong>${esc(s.value)}</strong></div>`}function noticeRow(n,t){const x=t.notice[n.k],title=x[0],detail=typeof x[1]==='function'?x[1](...(n.a||[])):x[1];return `<div class="notice ${n.type}"><span class="nmark">${n.type==='bad'?'×':'!'}</span><div><b>${esc(title)}</b><p>${esc(detail)}</p></div></div>`}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawRadar(d){const svg=$('radar'),axes=['quality','speed','flow','support','strength','cooling'],ang=[-90,-30,30,90,150,210],C=120,R=78,pt=(a,v)=>{const r=a*Math.PI/180,s=R*v/100;return [C+Math.cos(r)*s,C+Math.sin(r)*s]},pts=v=>ang.map(a=>pt(a,v).join(',')).join(' ');let h=[25,50,75,100].map(v=>`<polygon class="ring" points="${pts(v)}"/>`).join('');h+=ang.map(a=>{const p=pt(a,100);return `<line class="axis" x1="120" y1="120" x2="${p[0]}" y2="${p[1]}"/>`}).join('');const p=ang.map((a,i)=>pt(a,d[axes[i]]));h+=`<polygon class="poly" points="${p.map(x=>x.join(',')).join(' ')}"/>`+p.map(x=>`<circle class="pt" cx="${x[0]}" cy="${x[1]}" r="3.4"/>`).join('');svg.innerHTML=h}
