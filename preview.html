<style>

ing{display:grid;place-items:center;padding:40px}.drop{width:min(920px,80vw);height:min(550px,68vh);position:relative;overflow:hidden;border:1px solid var(--border);border-radius:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));box-shadow:0 24px 80px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.06);transition:.25s}.drop:before{content:"";position:absolute;inset:18px;border:1px dashed rgba(255,255,255,.08);border-radius:28px;pointer-events:none}.drop.drag{transform:scale(1.008);border-color:rgba(100,230,187,.42);background:rgba(100,230,187,.045)}.orb{position:absolute;width:360px;height:360px;border-radius:50%;filter:blur(60px);opacity:.12;pointer-events:none}.o1{background:var(--accent2);top:-190px;left:-140px}.o2{background:var(--accent);right:-180px;bottom:-210px}.dropIcon{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(100,230,187,.16),rgba(126,183,255,.08));border:1px solid rgba(100,230,187,.18);margin-bottom:22px;font-weight:900;color:var(--accent);font-size:25px}.dropIcon.scan{animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 12px rgba(100,230,187,.04)}}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.16em}.drop h1{margin:13px 0 8px;font-size:42px;letter-spacing:-.045em}.drop p{margin:0;color:var(--muted);font-size:14px}.dropActions{display:flex;gap:10px;margin:30px 0 20px}.primary,.ghost{border-radius:12px;padding:11px 16px;border:1px solid var(--border);cursor:pointer;font-weight:750;font-size:12px}.primary{background:#f2f7f5;color:#07100d;border-color:#f2f7f5}.ghost{background:rgba(255,255,255,.04);color:#fff}.drop small{color:#687582;font-size:11px}.err{display:none;max-width:650px;padding:10px 13px;border:1px solid rgba(255,127,127,.18);border-radius:12px;color:#ffaaaa;background:rgba(255,127,127,.055);font-size:11px;line-height:1.5}.workspace{display:none;grid-template-columns:210px 1fr;min-height:0}.sidebar{border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;justify-content:space-between}.nav{display:flex;flex-direction:column;gap:5px}.nav button{display:flex;gap:10px;align-items:center;border:0;background:transparent;color:#7d8997;padding:10px 12px;border-radius:11px;text-align:left;font-size:12px}.nav button.sel{color:#ecf3f8;background:linear-gradient(90deg,rgba(100,230,187,.10),rgba(255,255,255,.025));box-shadow:inset 2px 0 var(--accent)}.author{border:1px solid var(--border);background:rgba(255,255,255,.025);border-radius:14px;padding:10px;font-size:9px;color:#b7c1cc}.author small{display:block;color:#687582;margin-top:2px}.dash{overflow:auto;padding:22px 24px 40px}.panel{border:1px solid var(--border);background:var(--panel);backdrop-filter:blur(18px);box-shadow:inset 0 1px rgba(255,255,255,.035)}.health{min-height:152px;border-radius:28px;padding:22px 25px;display:flex;align-items:center;gap:22px}.score{--score:330deg;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) 0 var(--score),rgba(255,255,255,.07) var(--score) 360deg)}.score.warn{background:conic-gradient(var(--warning) 0 var(--score),rgba(255,255,255,.07) var(--score) 360deg)}.score.bad{background:conic-gradient(var(--danger) 0 var(--score),rgba(255,255,255,.07) var(--score) 360deg)}.score:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#0d1218}.score b{z-index:2;font-size:31px;letter-spacing:-.05em}.score small{position:absolute;z-index:2;bottom:24px;color:var(--muted);font-size:9px}.copy{flex:1}.copy h1{margin:8px 0 4px;font-size:28px;letter-spacing:-.035em}.copy p{margin:0;color:var(--muted);font-size:12px}.safe{opacity:.42;cursor:not-allowed}.summary{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin:12px 0}.card{border-radius:14px;padding:15px;min-height:94px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}.label{color:#778392;font-size:10px;text-transform:uppercase;letter-spacing:.11em}.card strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{align-self:flex-start;color:var(--accent);background:rgba(100,230,187,.08);border:1px solid rgba(100,230,187,.12);border-radius:999px;padding:4px 7px;font-size:9px;font-weight:750}.pill.warn{color:var(--warning);background:rgba(255,201,105,.075);border-color:rgba(255,201,105,.12)}.grid{display:grid;grid-template-columns:minmax(420px,1.35fr) minmax(320px,.9fr);gap:12px}.settings,.dna,.facts,.filaments,.notices{border-radius:20px;padding:18px}.settings,.dna{min-height:350px}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.head h2{margin:6px 0 0;font-size:18px}.sub{margin:7px 0 0;color:#778392;font-size:10px;line-height:1.45}.badge{color:#9da8b5;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:8px;font-weight:850;letter-spacing:.1em;border-radius:999px;padding:5px 7px}.row{min-height:55px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:11px;gap:15px}.name{display:flex;align-items:center;gap:6px;color:#c9d2dc}.info{position:relative;width:16px;height:16px;border:1px solid #5e6a77;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#82909f;cursor:help}.tooltip{position:absolute;width:330px;left:-80px;top:24px;background:#161e27;border:1px solid var(--border2);border-radius:14px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.46);display:none;z-index:30;line-height:1.45;color:#aab5c0}.info:hover .tooltip{display:block}.tooltip b{color:#fff}.tooltip p{margin:7px 0 10px}.dnaWrap{display:flex;align-items:center;gap:13px;min-height:250px}.radarWrap{width:244px;height:244px;position:relative;flex:0 0 auto}.radar{width:100%;height:100%}.ring{fill:none;stroke:rgba(255,255,255,.065);stroke-width:1}.axis{stroke:rgba(255,255,255,.045)}.poly{fill:rgba(100,230,187,.16);stroke:rgba(100,230,187,.78);stroke-width:2}.pt{fill:#d8fff2;stroke:#0d1515;stroke-width:1.5}.dnaText{font-size:10px;color:var(--muted);line-height:1.5;max-width:180px}.dnaText b{color:#dce3e9}.lower{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(360px,.9fr);gap:12px;margin-top:12px}.fact,.filrow{min-height:45px;border-top:1px solid var(--border);display:grid;align-items:center;gap:12px}.fact{grid-template-columns:.7fr 1.3fr}.fact span{color:#778392;font-size:10px}.fact b{text-align:right;color:#cbd4dd;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.filrow{grid-template-columns:14px 1fr auto}.swatch{width:12px;height:28px;border-radius:4px;border:1px solid rgba(255,255,255,.14)}.filrow b{display:block;font-size:10px;color:#d2dbe3}.filrow small{display:block;color:#687582;font-size:8px;margin-top:3px;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.filstat{font-size:9px;color:#9aa6b3}.notices{margin-top:12px}.notice{min-height:62px;border-top:1px solid var(--border);display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center}.nmark{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-weight:900;color:var(--accent);background:rgba(100,230,187,.08);border:1px solid rgba(100,230,187,.13)}.notice.warn .nmark{color:var(--warning);background:rgba(255,201,105,.07);border-color:rgba(255,201,105,.14)}.notice.bad .nmark{color:var(--danger);background:rgba(255,127,127,.07);border-color:rgba(255,127,127,.14)}.notice b{font-size:10px;color:#ced7df}.notice p{margin:4px 0 0;color:#778392;font-size:9px;line-height:1.45}@media(max-width:1200px){.grid,.lower{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}

<body>
<div class="app">
<header class="top"><div class="brand" id="home"><div class="mark">PG</div><div><b>PrintGuardian</b><small id="tagline"></small></div></div><div class="actions"><div class="chip" id="chip"></div><div class="lang"><button id="lv">LV</button><button id="en">EN</button></div></div></header>
<main class="landing" id="landing"><section class="drop" id="drop"><div class="orb o1"></div><div class="orb o2"></div><div class="dropIcon" id="dropIcon">⇧</div><div class="eyebrow">PRINTGUARDIAN PREFLIGHT</div><h1 id="dropTitle"></h1><p id="dropHint"></p><div class="dropActions"><button class="primary" id="browse"></button><button class="ghost" id="demo"></button></div><small id="localOnly"></small><div class="err" id="err"></div><input id="file" type="file" accept=".3mf,.gcode,.bgcode" hidden/></section></main>
<main class="workspace" id="workspace"><aside class="sidebar"><div class="nav" id="nav"></div><div class="author"><b id="author"></b><small>kas.id.lv · craftin.lv · GitHub: QvarcY</small></div></aside><section class="dash">
<section class="health panel"><div class="score" id="score"><b id="scoreNum">—</b><small>/100</small></div><div class="copy"><div class="eyebrow" id="healthLabel"></div><h1 id="healthTitle"></h1><p id="warnings"></p></div><button class="primary safe" id="safe"></button></section>
<div class="summary" id="summary"></div>
<div class="grid"><section class="settings panel"><div class="head"><div><div class="eyebrow" id="settingsEyebrow"></div><h2 id="settingsTitle"></h2><p class="sub" id="settingsHint"></p></div><span class="badge" id="settingsCount"></span></div><div id="settingRows"></div></section>
<section class="dna panel"><div class="head"><div><div class="eyebrow">VISUAL SIGNATURE</div><h2>Print DNA</h2></div><span class="pill">LIVE</span></div><div class="dnaWrap"><div class="radarWrap"><svg class="radar" id="radar" viewBox="0 0 240 240"></svg></div><div class="dnaText"><p><b id="dnaProfile"></b></p><p id="dnaNote"></p></div></div></section></div>
<div class="lower"><section class="facts panel"><div class="head"><div><div class="eyebrow">PROJECT MAP</div><h2 id="factsTitle"></h2></div><span>⌁</span></div><div id="facts"></div></section><section class="filaments panel"><div class="head"><div><div class="eyebrow">MATERIAL MAP</div><h2 id="filTitle"></h2></div><span>◫</span></div><div id="filRows"></div></section></div>
<section class="notices panel"><div class="head"><div><div class="eyebrow">PREFLIGHT</div><h2 id="noticeTitle"></h2></div><span>◇</span></div><div id="noticeRows"></div></section>
</section></main>
<footer class="footer"><span id="version"></span><span>© 2026 <b>CraftIN / QvarcY</b> · kas.id.lv · craftin.lv</span></footer>
</div>
<script>
const L={
en:{tagline:'Know before you print',dropTitle:'Drop your print here',dropHint:'3MF · G-code · BG-code',browse:'Browse files',demo:'Load demo project',localOnly:'The file is analyzed locally on your computer.',analyzing:'Analyzing project…',analyzingHint:'Reading 3MF structure, profiles, filaments and slicer settings.',unsupported:'Live analysis is currently connected for 3MF files. G-code and BG-code follow later.',invalid:'The file could not be analyzed as a 3MF project.',nav:['Overview','Project','Printer','Filaments','Settings','Risks','Compare'],author:'Created by CraftIN / QvarcY',healthLabel:'PRELIMINARY CHECK · REAL DATA',good:'PROJECT LOOKS CONSISTENT',review:'REVIEW SUGGESTED',critical:'CRITICAL ISSUES FOUND',warnLine:(w,c)=>`${w} warnings · ${c} critical issues · Not yet a full geometry/G-code safety audit.`,safe:'CREATE SAFE 3MF →',printer:'Printer profile',plate:'Build plate',filaments:'Filaments',geometry:'Geometry',read:'✓ Read',check:'! Review',unknown:'Not specified',objects:n=>`${n} objects`,settingsEye:'READ FROM 3MF',settingsTitle:'Slicer settings',settingsHint:'Names intentionally stay in English so they match Bambu Studio / OrcaSlicer.',values:n=>`${n} VALUES`,factsTitle:'Project facts',fileSize:'File size',archive:'3MF container',entries:n=>`${n} files in container`,params:n=>`${n} project settings parameters`,parts:n=>`${n} parts`,plates:n=>`${n} plates`,thumbnail:'Preview image',present:'Present',missing:'Missing',process:'Process profile',filTitle:'Filament palette',noFil:'No filament profile data could be found in this file.',noticeTitle:'Inspection results',noNotice:'Nothing suspicious was found at the current inspection level.',scoreNote:'The v0.2 score is based on 3MF structure and a small set of setting checks; it does not yet prove that a print will succeed.',version:'v0.2 · live 3MF Inspector',tips:{'Layer height':['Controls the height of each printed layer.','Higher usually prints faster but lowers vertical detail.','Lower gives finer detail but increases print time.'],'Wall loops':['Controls how many perimeter walls are printed around the part.','More walls usually improve wall strength but use more material and time.','Fewer walls reduce time and material but may reduce strength.'],'Sparse infill density':['Controls how much internal sparse structure is placed inside the model.','Higher can increase stiffness and material use.','Lower prints faster and uses less material.'],'Enable support':['Controls whether the slicer generates support structures.','Enabled supports can make difficult overhangs printable.','Disabled uses less material but some geometry may fail.'],'Brim width':['Controls brim width around the first layer to improve adhesion.','Wider brim can improve stability and reduce lifting.','Narrower brim reduces cleanup but provides less stabilization.'],'Max volumetric speed':['Defines the maximum amount of filament the hotend may extrude per second.','Higher allows more speed but too high can cause under-extrusion.','Lower is safer for flow consistency but may increase print time.']},notice:{many:['Unusually large filament palette',n=>`The project stores ${n} filament profiles. Some may be leftovers from the author's AMS setup.`],missing:['project_settings.config is missing','The global Bambu/Orca slicer settings file was not found.'],objects:['No printable geometry found','No configured or build objects could be found in the 3MF structure.'],layer:['Very high Layer height',(l,n)=>`Layer height ${l} mm is more than 80% of the ${n} mm nozzle diameter.`],wall:['Only one perimeter wall',w=>`Wall loops is set to ${w}. This may be too little for some functional parts.`]}},
lv:{tagline:'Zini, pirms drukā',dropTitle:'Ievelc drukas failu šeit',dropHint:'3MF · G-code · BG-code',browse:'Izvēlēties failu',demo:'Atvērt demo projektu',localOnly:'Fails tiek analizēts lokāli tavā datorā.',analyzing:'Analizēju projektu…',analyzingHint:'Nolasa 3MF struktūru, profilus, filamentus un slicer iestatījumus.',unsupported:'Šobrīd reālā analīze ir pieslēgta 3MF failiem. G-code un BG-code sekos vēlāk.',invalid:'Failu neizdevās analizēt kā 3MF projektu.',nav:['Pārskats','Projekts','Printeris','Filamenti','Iestatījumi','Riski','Salīdzināt'],author:'Izveidoja CraftIN / QvarcY',healthLabel:'SĀKOTNĒJĀ PĀRBAUDE · REĀLI DATI',good:'PROJEKTS IZSKATĀS KOREKTS',review:'IETEICAMS PĀRBAUDĪT',critical:'ATRASTAS KRITISKAS PROBLĒMAS',warnLine:(w,c)=>`${w} brīdinājumi · ${c} kritiskas problēmas · Šis vēl nav pilns ģeometrijas/G-code drošības audits.`,safe:'IZVEIDOT DROŠU 3MF →',printer:'Printer profile',plate:'Build plate',filaments:'Filamenti',geometry:'Geometry',read:'✓ Nolasīts',check:'! Pārbaudīt',unknown:'Nav norādīts',objects:n=>`${n} objekti`,settingsEye:'NOLASĪTS NO 3MF',settingsTitle:'Slicer settings',settingsHint:'Nosaukumi apzināti atstāti angliski, lai tie sakristu ar Bambu Studio / OrcaSlicer.',values:n=>`${n} VĒRTĪBAS`,factsTitle:'Projekta dati',fileSize:'Faila izmērs',archive:'3MF konteiners',entries:n=>`${n} faili konteinerā`,params:n=>`${n} project settings parametri`,parts:n=>`${n} parts`,plates:n=>`${n} plates`,thumbnail:'Preview image',present:'Ir',missing:'Nav',process:'Process profile',filTitle:'Filament palette',noFil:'Failā neizdevās atrast filamenta profilu datus.',noticeTitle:'Pārbaudes rezultāti',noNotice:'Šajā pārbaudes līmenī nekas aizdomīgs netika atrasts.',scoreNote:'V0.2 vērtējums balstās uz 3MF struktūras un dažu iestatījumu pārbaudēm; tas vēl neapstiprina, ka druka noteikti izdosies.',version:'v0.2 · dzīvs 3MF Inspector',tips:{'Layer height':['Nosaka viena izdrukātā slāņa augstumu.','Lielāks slānis parasti drukājas ātrāk, bet samazina vertikālo detalizāciju.','Mazāks slānis dod smalkāku virsmu, bet palielina drukas laiku.'],'Wall loops':['Nosaka, cik perimetra sienas tiek drukātas apkārt detaļai.','Vairāk sienu parasti palielina izturību, bet patērē vairāk materiāla un laika.','Mazāk sienu samazina laiku un materiālu, bet var samazināt izturību.'],'Sparse infill density':['Nosaka retinātā iekšējā pildījuma daudzumu.','Lielāka vērtība var palielināt stingrību un materiāla patēriņu.','Mazāka vērtība drukājas ātrāk un patērē mazāk materiāla.'],'Enable support':['Nosaka, vai sliceris ģenerēs support struktūras.','Ieslēgti supporti var padarīt sarežģītas pārkares drukājamas.','Bez supportiem ir mazāk atkritumu, bet dažas ģeometrijas var neizdoties.'],'Brim width':['Nosaka brim platumu ap pirmo slāni, lai uzlabotu saķeri.','Platāks brim var uzlabot stabilitāti un samazināt atlīmēšanos.','Šaurāks brim nozīmē mazāk pēcapstrādes, bet mazāku stabilizāciju.'],'Max volumetric speed':['Nosaka maksimālo plastmasas daudzumu, ko hotend drīkst izspiest sekundē.','Lielāka vērtība ļauj drukāt ātrāk, bet pārāk liela var izraisīt nepietiekamu ekstrūziju.','Mazāka vērtība ir drošāka plūsmai, bet var palielināt drukas laiku.']},notice:{many:['Neparasti liela filamenta palete',n=>`Projektā ir ${n} filamenta profili. Daļa var būt autora AMS konfigurācijas pārpalikums.`],missing:['Nav project_settings.config','Nav atrasts Bambu/Orca globālo slicer iestatījumu fails.'],objects:['Nav atrasta drukājama ģeometrija','3MF struktūrā neizdevās atrast konfigurētus vai build objektus.'],layer:['Ļoti liels Layer height',(l,n)=>`Layer height ${l} mm ir vairāk nekā 80% no ${n} mm nozzle diametra.`],wall:['Tikai viena ārējā siena',w=>`Wall loops vērtība ir ${w}. Dažām funkcionālām detaļām tas var būt par maz.`]}}
};
let lang=localStorage.getItem('pg-lang')||'lv',current=null;
const $=id=>document.getElementById(id);
function setLang(l){lang=l;localStorage.setItem('pg-lang',l);document.documentElement.lang=l;$('lv').classList.toggle('active',l==='lv');$('en').classList.toggle('active',l==='en');const t=L[l];$('tagline').textContent=t.tagline;$('dropTitle').textContent=t.dropTitle;$('dropHint').textContent=t.dropHint;$('browse').textContent=t.browse;$('demo').textContent=t.demo;$('localOnly').textContent=t.localOnly;$('author').textContent=t.author;$('version').textContent=t.version;$('safe').textContent=t.safe;renderNav();if(current)render(current)}
function renderNav(){const t=L[lang];$('nav').innerHTML=t.nav.map((x,i)=>`<button class="${i===0?'sel':''}"><span>${['◉','◇','⌁','◫','≡','!','⇄'][i]}</span>${x}</button>`).join('')}
$('lv').onclick=()=>setLang('lv');$('en').onclick=()=>setLang('en');$('home').onclick=reset;$('browse').onclick=()=>$('file').click();$('file').onchange=e=>e.target.files[0]&&loadFile(e.target.files[0]);$('demo').onclick=()=>render(demoData());
const drop=$('drop');drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])};
function reset(){current=null;$('workspace').style.display='none';$('landing').style.display='grid';$('chip').style.display='none';$('err').style.display='none';$('dropIcon').classList.remove('scan');setLang(lang)}
function busy(on){$('dropIcon').classList.toggle('scan',on);$('dropTitle').textContent=on?L[lang].analyzing:L[lang].dropTitle;$('dropHint').textContent=on?L[lang].analyzingHint:L[lang].dropHint}
function showError(msg){$('err').textContent=msg;$('err').style.display='block'}
async function loadFile(file){$('err').style.display='none';if(!file.name.toLowerCase().endsWith('.3mf')){showError(L[lang].unsupported);return}busy(true);try{render(await inspect3mf(file))}catch(e){console.error(e);showError(L[lang].invalid+' '+e.message)}finally{busy(false)}}
function fmtBytes(n){const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}

function render(d){current=d;const t=L[lang];$('landing').style.display='none';$('workspace').style.display='grid';$('chip').style.display='block';$('chip').textContent='● '+d.name;$('scoreNum').textContent=d.score;$('score').style.setProperty('--score',d.score*3.6+'deg');const crit=d.notices.filter(x=>x.type==='bad').length,warn=d.notices.filter(x=>x.type==='warn').length;$('score').className='score '+(crit?'bad':warn?'warn':'');$('healthLabel').textContent=t.healthLabel;$('healthTitle').textContent=crit?t.critical:warn?t.review:t.good;$('warnings').textContent=t.warnLine(warn,crit);$('summary').innerHTML=card(t.printer,(d.printer||t.unknown)+(d.nozzle?' · '+d.nozzle+' mm':''),false)+card(t.plate,d.plate||t.unknown,false)+card(t.filaments,d.filaments.length?d.filaments[0].type+(d.filaments.length>1?' +'+(d.filaments.length-1):''):t.unknown,d.filaments.length>8)+card(t.geometry,t.objects(d.objects),d.objects===0);$('settingsEyebrow').textContent=t.settingsEye;$('settingsTitle').textContent=t.settingsTitle;$('settingsHint').textContent=t.settingsHint;$('settingsCount').textContent=t.values(d.settings.length);$('settingRows').innerHTML=d.settings.map(s=>settingRow(s,t)).join('')||`<div class="row">${t.unknown}</div>`;$('factsTitle').textContent=t.factsTitle;$('facts').innerHTML=fact(t.process,d.process||t.unknown)+fact(t.fileSize,fmtBytes(d.size))+fact(t.archive,t.entries(d.entries))+fact('project_settings.config',t.params(d.params))+fact('Geometry',`${d.objects} objects · ${t.parts(d.parts)}`)+fact('Plates',t.plates(d.plates))+fact(t.thumbnail,d.thumbnail?t.present:t.missing);$('filTitle').textContent=t.filTitle;$('filRows').innerHTML=d.filaments.length?d.filaments.slice(0,8).map(f=>`<div class="filrow"><span class="swatch" style="background:${f.color||'rgba(255,255,255,.16)'}"></span><div><b>F${f.i} · ${esc(f.type)}</b><small>${esc([f.vendor,f.profile].filter(Boolean).join(' · ')||'—')}</small></div><span class="filstat">${f.grams?f.grams+' g':f.flow?f.flow+' mm³/s'
